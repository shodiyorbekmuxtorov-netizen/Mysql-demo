<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ismlar daftari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d17;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f4f5fb;
      --muted: #9aa0b8;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --danger: #ff5c7a;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background glow */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 520px; height: 520px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.45;
      z-index: -1;
      animation: float 18s ease-in-out infinite alternate;
    }
    body::before { background: var(--accent); top: -160px; left: -120px; }
    body::after  { background: var(--accent-2); bottom: -180px; right: -140px; animation-delay: -9s; }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(60px, 40px) scale(1.15); }
    }

    .container { width: 100%; max-width: 560px; }

    header { text-align: center; margin-bottom: 32px; }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--card-border);
      font-size: 13px; color: var(--muted);
      margin-bottom: 18px;
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #34d399; box-shadow: 0 0 10px #34d399;
    }

    h1 {
      font-size: clamp(30px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #b9a8ff 70%, var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .subtitle { color: var(--muted); margin-top: 10px; font-size: 15px; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    form { display: flex; gap: 10px; }

    input {
      flex: 1; min-width: 0;
      padding: 14px 16px;
      font: inherit; font-size: 16px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #6b7190; }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.25);
    }

    .btn-primary {
      padding: 14px 22px;
      font: inherit; font-weight: 600; font-size: 15px;
      color: #fff;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #5b8cff);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.4);
      transition: transform .15s, box-shadow .2s, opacity .2s;
      white-space: nowrap;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(124, 92, 255, 0.55); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .6; cursor: wait; }

    .list-head {
      display: flex; justify-content: space-between; align-items: center;
      margin: 28px 4px 12px;
      font-size: 14px; color: var(--muted);
    }
    .count {
      background: var(--card); border: 1px solid var(--card-border);
      padding: 3px 10px; border-radius: 999px; font-weight: 600; color: var(--text);
    }

    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    li {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 14px 14px 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      transition: transform .2s, background .2s, opacity .3s;
      animation: slideIn .35s ease both;
    }
    li:hover { background: rgba(255, 255, 255, 0.09); transform: translateX(3px); }
    li.removing { opacity: 0; transform: translateX(30px) scale(.97); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      flex-shrink: 0;
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 17px; color: #fff;
    }

    .info { flex: 1; min-width: 0; }
    .name {
      font-weight: 600; font-size: 16px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .date { color: var(--muted); font-size: 13px; margin-top: 2px; }

    .btn-delete {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      font: inherit; font-size: 13px; font-weight: 600;
      color: var(--danger);
      background: rgba(255, 92, 122, 0.1);
      border: 1px solid rgba(255, 92, 122, 0.25);
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s, color .2s, transform .15s;
    }
    .btn-delete:hover { background: var(--danger); color: #fff; }
    .btn-delete:active { transform: scale(.95); }
    .btn-delete:disabled { opacity: .5; cursor: wait; }
    .btn-delete svg { width: 15px; height: 15px; }

    .empty, .loading {
      text-align: center; color: var(--muted);
      padding: 40px 20px;
      border: 1px dashed var(--card-border);
      border-radius: 14px;
    }
    .empty .icon { font-size: 34px; margin-bottom: 8px; }

    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translateX(-50%) translateY(120px);
      background: #1b1e2e; border: 1px solid var(--card-border);
      padding: 12px 18px; border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      transition: transform .3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255, 92, 122, .5); }

    @media (max-width: 480px) {
      body { padding-top: 36px; }
      .btn-delete span { display: none; }
      .btn-primary { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="badge"><span class="dot"></span> MySQL bilan ulangan</div>
      <h1>Ismingizni qoldiring</h1>
      <p class="subtitle">Ismingizni yozing va ro‘yxatga qo‘shing</p>
    </header>

    <div class="card">
      <form id="nameForm">
        <input type="text" id="nameInput" placeholder="Ismingiz..." autocomplete="off" maxlength="100">
        <button type="submit" class="btn-primary" id="saveBtn">Saqlash</button>
      </form>
    </div>

    <div class="list-head">
      <span>Ro‘yxat</span>
      <span class="count" id="count">0</span>
    </div>
    <ul id="list"><li class="loading" style="display:block">Yuklanmoqda...</li></ul>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const API = '/.netlify/functions/api';
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');

    const gradients = [
      ['#7c5cff', '#5b8cff'], ['#22d3ee', '#3b82f6'], ['#f472b6', '#a855f7'],
      ['#34d399', '#10b981'], ['#fb923c', '#f43f5e'], ['#facc15', '#f97316']
    ];

    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function toast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function updateCount() {
      countEl.textContent = listEl.querySelectorAll('li[data-id]').length;
    }

    function render(data) {
      if (!data.length) {
        listEl.innerHTML = `<div class="empty"><div class="icon">📭</div>Hozircha hech kim yo‘q. Birinchi bo‘ling!</div>`;
        countEl.textContent = 0;
        return;
      }
      listEl.innerHTML = data.map((r, i) => {
        const name = String(r.name ?? '');
        const d = new Date(r.created_at).toLocaleString('en-GB');
        const [a, b] = gradients[(name.charCodeAt(0) || 0) % gradients.length];
        return `
          <li data-id="${escapeHtml(r.id)}" style="animation-delay:${Math.min(i, 10) * 40}ms">
            <div class="avatar" style="background:linear-gradient(135deg,${a},${b})">${escapeHtml(name.charAt(0).toUpperCase() || '?')}</div>
            <div class="info">
              <div class="name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
              <div class="date">${d}</div>
            </div>
            <button class="btn-delete" data-id="${escapeHtml(r.id)}" data-name="${escapeHtml(name)}" aria-label="O‘chirish">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
              <span>O‘chirish</span>
            </button>
          </li>`;
      }).join('');
      updateCount();
    }

    async function load() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error();
        render(await res.json());
      } catch {
        listEl.innerHTML = `<div class="empty">Ma’lumotlarni yuklab bo‘lmadi</div>`;
      }
    }

    document.getElementById('nameForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inp = document.getElementById('nameInput');
      const btn = document.getElementById('saveBtn');
      const name = inp.value.trim();
      if (!name) return inp.focus();
      btn.disabled = true;
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error();
        inp.value = '';
        toast('✅ Saqlandi');
        await load();
      } catch {
        toast('Saqlashda xatolik yuz berdi', true);
      } finally {
        btn.disabled = false;
        inp.focus();
      }
    });

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.btn-delete');
      if (!btn) return;
      const { id, name } = btn.dataset;
      if (!confirm(`"${name}" ni o‘chirmoqchimisiz?`)) return;
      btn.disabled = true;
      try {
        const res = await fetch(`${API}?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        const li = btn.closest('li');
        li.classList.add('removing');
        setTimeout(() => {
          li.remove();
          updateCount();
          if (!listEl.querySelector('li[data-id]')) render([]);
        }, 300);
        toast('🗑️ O‘chirildi');
      } catch {
        btn.disabled = false;
        toast('O‘chirishda xatolik yuz berdi', true);
      }
    });

    load();
  </script>
</body>
</html>
